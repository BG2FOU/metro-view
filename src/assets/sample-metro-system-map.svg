<svg xmlns="http://www.w3.org/2000/svg" class="system-map" viewBox="0 0 1000 800" role="img" aria-label="合成 A/B 线线网图"><style>.route-line{fill:none;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.station circle{fill:white;stroke:#555;stroke-width:3}.station-label{font:18px sans-serif;fill:#263445}.station-en{font:12px sans-serif;fill:#536174}</style>
<g data-route="line-A"><path class="route-line" stroke="#E54B4B" d="M130 400 L315 400 L500 400 L685 400 L870 400"/></g>
<g class="station" data-station="a-terminal" data-lines="A" transform="translate(130 400)"><circle r="10"/><text class="station-label" text-anchor="middle" x="0" y="-32">晨曦站</text><text class="station-en" text-anchor="middle" x="0" y="-14">Dawn</text></g>
<g class="station" data-station="a-museum-reserved" data-lines="A" transform="translate(315 400)"><circle r="10"/><text class="station-label" text-anchor="middle" x="0" y="-32">博览站（预留）</text><text class="station-en" text-anchor="middle" x="0" y="-14">Museum (Reserved)</text></g>
<g class="station" data-station="a-central" data-lines="A" transform="translate(500 400)"><circle r="10"/><text class="station-label" text-anchor="middle" x="0" y="-32">中央站</text><text class="station-en" text-anchor="middle" x="0" y="-14">Central</text></g>
<g class="station" data-station="a-riverside" data-lines="A" transform="translate(685 400)"><circle r="10"/><text class="station-label" text-anchor="middle" x="0" y="-32">滨河站</text><text class="station-en" text-anchor="middle" x="0" y="-14">Riverside</text></g>
<g class="station" data-station="a-harbor" data-lines="A" transform="translate(870 400)"><circle r="10"/><text class="station-label" text-anchor="middle" x="0" y="-32">远航站</text><text class="station-en" text-anchor="middle" x="0" y="-14">Voyage</text></g>
<g data-route="line-B"><path class="route-line" stroke="#3B82F6" d="M500 680 L500 540 L500 400 L500 260 L500 120"/></g>
<g class="station" data-station="b-west" data-lines="B" transform="translate(500 680)"><circle r="10"/><text class="station-label" text-anchor="start" x="26" y="0">新城西站</text><text class="station-en" text-anchor="start" x="26" y="18">New Town West</text></g>
